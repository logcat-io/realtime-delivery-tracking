# docker-compose.yml — 로컬 인프라 (단일 노드)
#
# 다중 인스턴스 fan-out 을 재현하려면 앱을 두 벌 띄운다:
#   ./gradlew bootRun --args='--server.port=8080'
#   ./gradlew bootRun --args='--server.port=8081'
# 두 인스턴스가 같은 Kafka consumer group 을 쓰므로 이벤트는 한쪽에만 도달한다.
# Redis Pub/Sub 이 그 간극을 메운다.

services:
  # ──────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────
  # 왜 PostgreSQL 인가?
  # → FOR UPDATE SKIP LOCKED — Outbox 폴링을 다중 인스턴스에서 중복 없이 나눠 갖는다
  # → JSONB — Outbox payload 를 그대로 저장하고 부분 조회한다
  # → uuid_generate_v7() 는 확장 없이 순수 SQL 로 정의한다 (V0 마이그레이션)
  postgres:
    image: postgres:16-alpine
    container_name: tracking-postgres
    ports:
      - "15433:5432"                      # 호스트 15433 → 컨테이너 5432 (로컬 PG 충돌 회피)
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # Redis 7 — 인스턴스 간 fan-out
  # ──────────────────────────────────────────
  # 왜 Redis Pub/Sub 인가?
  # → Kafka consumer group 은 파티션을 인스턴스에 나눠 준다. 사용자가 붙어 있는
  #   인스턴스와 이벤트를 받은 인스턴스가 다를 수 있다 (fan-out 한계).
  # → Pub/Sub 은 구독한 모든 인스턴스에 뿌린다. SSE 연결이 어디 있든 도달한다.
  # → 대가: Pub/Sub 은 영속이 없다. 구독자가 없는 순간의 메시지는 사라진다.
  #   그래서 SSE 재연결 시 현재 상태를 DB 에서 다시 읽어 공백을 메운다.
  redis:
    image: redis:7-alpine
    container_name: tracking-redis
    ports:
      - "16379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # allkeys-lru: 여기서 Redis 는 신뢰원이 아니라 전달 통로다.
    #              유실되면 DB 재조회로 복구되므로 evict 를 허용한다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Kafka — cp-kafka 7.6 (KRaft, Zookeeper 없음)
  # ──────────────────────────────────────────
  # 왜 Kafka 인가?
  # → 상태 전이 이벤트는 순서가 의미를 가진다 (deliveryId 를 파티션 키로)
  # → 디스크 영속 → consumer 가 죽어 있던 구간을 offset 으로 따라잡는다
  # → Outbox 가 "DB 커밋된 것만 발행"을 보장하고, Kafka 가 "발행된 것은 안 사라짐"을 보장한다
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: tracking-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 클라이언트(로컬 앱)가 받아 재접속할 주소 = 호스트 매핑 포트와 일치해야 함
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    driver: local
