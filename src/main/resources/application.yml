server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: realtime-delivery-tracking

  datasource:
    url: jdbc:postgresql://localhost:15433/tracking
    username: tracking
    password: tracking
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 1800000
      connection-timeout: 3000   # 3초 — 풀 고갈을 빨리 드러낸다

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jooq:
    sql-dialect: postgres

  kafka:
    bootstrap-servers: localhost:19092

  data:
    redis:
      host: localhost
      port: 16379

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.logcat.tracking: DEBUG
